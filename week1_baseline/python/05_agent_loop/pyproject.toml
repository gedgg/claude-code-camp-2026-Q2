[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boukensha"
version = "0.1.0"
description = "Boukensha tool-calling agent loop (Python port of week1_baseline/ruby/05_agent_loop)"
readme = "README.md"
authors = [
    { name = "gedgg", email = "gediminas.bijeikis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boukensha"]
