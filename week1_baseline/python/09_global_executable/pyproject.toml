[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boukensha"
version = "0.9.0"
description = "BOUKENSHA global executable — a real, installable command that resolves which step to load (Python port of week1_baseline/ruby/09_global_executable)"
readme = "README.md"
authors = [
    { name = "gedgg", email = "gediminas.bijeikis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0.1",
]

[project.scripts]
# Named boukensha-py, not boukensha, so it can coexist with the Ruby gem's
# already-installed `boukensha` executable rather than fighting over $PATH order.
boukensha-py = "boukensha_loader:main"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boukensha"]

[tool.hatch.build.targets.wheel.force-include]
"src/boukensha_loader.py" = "boukensha_loader.py"
